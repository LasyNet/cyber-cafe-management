name: CI

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package.json
            backend/clients-service/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install clients service dependencies
        working-directory: backend/clients-service
        run: npm ci

      - name: Build clients service
        working-directory: backend/clients-service
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install auth service dependencies
        run: python -m pip install --disable-pip-version-check -r backend/auth-service/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend/auth-service/app

      - name: Validate Docker Compose configuration
        run: |
          cp infrastructure/env.example infrastructure/.env
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml config --quiet

      - name: Build backend Docker images
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml build auth-service clients-service
